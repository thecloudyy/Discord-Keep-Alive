[project]
name = "discord-keep-alive"
version = "1.0.0"
description = "Keeps your Discord account parked in a voice channel, quietly."
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    # pinned to an audited commit of master (the PyPI release pins an old davey / DAVE voice lib)
    "discord.py-self[voice] @ git+https://github.com/dolfies/discord.py-self@2ba64a9a997e151a9c259984e0a179b1fdf4aff4",
]

[project.scripts]
discord-keep-alive = "vc_keeper.app:main"

[dependency-groups]
dev = ["ruff>=0.12", "pyright>=1.1.400"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "ASYNC", "RUF"]

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "standard"

[tool.setuptools.packages.find]
where = ["src"]
